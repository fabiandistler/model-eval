# All models route via OpenRouter (https://openrouter.ai).
# Required env var: OPENROUTER_API_KEY
#
# Fields:
#   name              Display name in the Shiny app
#   model_id          Internal join key + filename for results_rds/<id>.rds
#   provider          Informational, used for plot colors
#   release_date      For sorting / display
#   api_model_id      OpenRouter model slug (see https://openrouter.ai/models)
#   input_price       USD per 1M input tokens - fallback only; the eval
#   output_price      USD per 1M output tokens - pulls live cost from OpenRouter
#                     via usage:{include:true} when available.
#   reasoning_effort  Optional: "low" | "medium" | "high" for reasoning models
#
# Pricing below is approximate as of May 2026. Verify via
#   curl https://openrouter.ai/api/v1/models | jq '.data[] | select(.id=="...") | .pricing'
# before relying on it for budgeting.
models:
  - name: MiniMax 2.5
    model_id: minimax_2_5
    provider: MiniMax
    release_date: 2026-02-12
    api_model_id: minimax/minimax-m2.5
    input_price: 0.15
    output_price: 1.15

